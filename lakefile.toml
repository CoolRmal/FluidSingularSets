name = "FluidSingularSets"
version = "0.1.0"
defaultTargets = ["FluidSingularSets", "Challenge"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

[[require]]
name = "CKN"
git = "https://github.com/scottnarmstrong/CaffarelliKohnNirenberg.git"
rev = "c26903f8e38b7b5a4594c80892e51b0599e8fd82"

[[lean_lib]]
name = "FluidSingularSets"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
