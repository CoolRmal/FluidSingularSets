status:
  scope: >-
    Three target declarations for the two requested conclusions are independently
    restated using Mathlib alone. The complete finite successive-logarithm gauge
    family and its original logarithmic-square corollary are proved from actual
    suitable weak data, the genuine Frostman trace and the pinned CKN dependency.
    The literal repeated-deepest logarithmic gauge also has proved nullity at
    every finite depth. The box development proves actual moving-frame suitability,
    pressure-gradient integrability, a common finite compact charge measure and
    the singular reverse-charge reduction conditional on its analytic criterion.
    The analytic development proves the genuine local Stokes projection, nonsmooth
    projected energy inequality, actual terminal-free radius Caccioppoli estimate,
    native initial projected energy and nonlinear pressure, true Gaussian error
    bounds and energy extraction, normalized pressure contraction and the actual
    nonlinear iteration step. A positive geometric projected-energy budget implies
    original CKN regularity. The remaining work joins nonlinear recurrence trapping
    to origin regularity and to the uniform fixed inner-cylinder criterion.
    The box-dimension target retains one placeholder. Full Comparator verification,
    official Palomar preflight and registration remain pending its completion.
  sorry_count: 1
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["GPT-6"]
      framework: "Codex"
      tool_setup: "Lean LSP, compiler, mathematical source audit, and parallel proof agents"
      cost:
        wall_time: "In progress"
        spend_usd: "not tracked"
        hardware: "local macOS computer"
      prompting_notes: >-
        Formalize the unconditional gauge family and local box bound, reuse CKN,
        meet Palomar standards, and publish frequent checkpoints in a public repository.
  spend_usd: "not tracked"
  notes: "Human maintainer identified from the authenticated GitHub profile; AI credited as automation."

fidelity:
  divergences: >-
    Statements use the CKN comparator's local Hölder regularity convention.
    BoundedRegularity proves its equivalence to the manuscripts' local essential
    boundedness under actual suitability. Box dimension is localized to compact
    interior patches and the force is identically zero. The gauge family uses
    successive factors log^i(1/r), i from 1 to k, extended with max(1, factor)
    away from zero. The extension agrees exactly with the requested positive
    product at all sufficiently small radii. The literal repeated-deepest formula
    also has a proved nullity corollary in RepeatedLogGauge.

