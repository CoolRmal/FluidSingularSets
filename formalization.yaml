        Formalize the unconditional gauge family and local box bound, reuse CKN,
        meet Palomar standards, and publish frequent checkpoints in a public repository.
  spend_usd: "not tracked"
  notes: "Human maintainer identified from the authenticated GitHub profile; AI credited as automation."

fidelity:
  divergences: >-
    Statements use the CKN comparator's local Hölder regularity convention.
    BoundedRegularity proves its equivalence to the manuscripts' local essential
    boundedness under actual suitability. Box dimension is localized to compact
    interior patches and the force is identically zero. The gauge family uses
    successive factors log^i(1/r), i from 1 to k, extended with max(1, factor)
    away from zero. The extension agrees exactly with the requested positive
    product at all sufficiently small radii. The literal repeated-deepest formula
    also has a proved nullity corollary in RepeatedLogGauge.

