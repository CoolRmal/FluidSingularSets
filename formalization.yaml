status:
  scope: >-
    Three target declarations for the two requested conclusions are independently
    restated using Mathlib alone. The complete finite successive-logarithm gauge
    family and its original logarithmic-square corollary are proved from actual
    suitable weak data, the genuine Frostman trace and the pinned CKN dependency.
    The literal repeated-deepest logarithmic gauge also has proved nullity at
    every finite depth. The box development proves actual moving-frame suitability,
    pressure-gradient integrability, a common finite compact charge measure and
    the singular reverse-charge reduction and its genuine uniform analytic criterion.
    The analytic development proves the genuine local Stokes projection, nonsmooth
    projected energy inequality, actual terminal-free radius Caccioppoli estimate,
    native initial projected energy and nonlinear pressure, true Gaussian error
    bounds and energy extraction, normalized pressure contraction and the actual
    nonlinear iteration step. A positive geometric projected-energy budget implies
    original CKN regularity. The actual finite shrinking sequence and positive
    nonlinear trap give native origin regularity; genuine quarter-box rescaling
    and compact regularity give a universal fixed inner-cylinder criterion.
    All three target declarations are proved without placeholders or added
    analytic hypotheses. Full Comparator verification and official Palomar preflight
    passed for source snapshot dd3ae61ce421a634818f52a6e11a8b78dd1bfc97.
    That snapshot is registered as PALOMAR-2026-10-06-000006, version 1:
    https://palomar-registry.org/entry.html?id=PALOMAR-2026-10-06-000006&version=1.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

