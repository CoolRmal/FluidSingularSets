    authors: ["Yongxi Lin"]
    type: paper
    location: "papers/log-squared.tex"
    relationship: formalizes
    note: "Research manuscript supplied in the local project; the gauge proof and finite-depth extension are completed."
  - title: "Packing dimension and logarithmic gauges for the Navier–Stokes singular set"
    type: paper
    location: "papers/box-25-23.tex"
    relationship: formalizes
    note: "Local research draft provided by the project maintainer."
  - title: "Remarks on interior regularity criteria without pressure for the Navier–Stokes equations"
    authors: ["Shuai Li", "Wendong Wang", "Daoguo Zhou"]
    type: paper
    location: "https://arxiv.org/abs/2305.00698"
    relationship: background
    note: "Background for the velocity-only regularity criterion proved internally from actual projected energy and pressure estimates."

