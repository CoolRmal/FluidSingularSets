name: Completed gauge theorem comparison

# This independently checks only the two completed gauge targets. It is not
# the complete project check or the official Palomar mechanical preflight.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gauge-comparator:
    name: Sandbox and replay the completed gauge proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          auto-config: false
          use-github-cache: false
      - name: Enable the required Linux sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare only the completed gauge targets
        run: |
          lake exe cache get
          lake comparator --config comparator-gauges.json --paranoid
